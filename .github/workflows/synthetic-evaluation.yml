name: Synthetic evaluation report

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/login_logs.csv"
      - "requirements.txt"
      - ".github/workflows/synthetic-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Generate consolidated synthetic evaluation
        run: python -m src.evaluation_suite

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-report
          path: reports/
          if-no-files-found: error
          retention-days: 30
