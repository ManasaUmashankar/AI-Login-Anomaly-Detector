name: Synthetic evaluation report

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/login_logs.csv"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/synthetic-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Build API Docker image
        run: docker build --tag ai-login-anomaly-detector:ci .

      - name: Smoke-test API container
        run: |
          set -euo pipefail
          docker run --detach --rm --name detector-api-ci -p 127.0.0.1:8001:8000 -e DETECTOR_API_KEY=ci-test-key ai-login-anomaly-detector:ci
          cleanup() { docker rm --force detector-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs detector-api-ci; exit 1; fi
          curl --fail --silent http://127.0.0.1:8001/ready
          response=$(curl --fail-with-body --silent --show-error -X POST http://127.0.0.1:8001/predict \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-test-key' \
            -d '{"timestamp":"2026-11-14T10:00:00Z","username":"ci-smoke-user","ip_address":"203.0.113.250","location":"Bengaluru, India","device":"Windows Laptop","login_status":"success","failed_attempts":0}')
          RESPONSE="$response" python - <<'PY'
          import json, os
          result = json.loads(os.environ["RESPONSE"])
          required = {"timestamp", "username", "risk_score", "risk_level", "ml_result", "final_status", "detection_reasons", "risk_signals", "mitre_attack", "disclaimer"}
          missing = required.difference(result)
          if missing:
              raise SystemExit(f"Prediction response missing fields: {sorted(missing)}")
          if result["username"] != "ci-smoke-user":
              raise SystemExit("Prediction response did not correspond to submitted event")
          print("API container health, model readiness, and authenticated prediction smoke test passed.")
          PY

      - name: Generate consolidated synthetic evaluation
        run: python -m src.evaluation_suite

      - name: Validate evaluation report outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          required = ["evaluation_summary.csv", "evaluation_report.md", "multi_seed_summary.csv", "temporal_window_metrics.csv"]
          missing = [name for name in required if not (Path("reports") / name).is_file()]
          if missing:
              raise SystemExit(f"Missing evaluation outputs: {missing}")
          summary = pd.read_csv(Path("reports") / "evaluation_summary.csv")
          if not summary.columns.is_unique:
              raise SystemExit("evaluation_summary.csv contains duplicate headers")
          expected = {"evaluation_scope", "detector", "metric", "mean", "std", "tp", "fp", "fn", "tn"}
          if set(summary.columns) != expected:
              raise SystemExit(f"Unexpected evaluation summary schema: {summary.columns.tolist()}")
          print(f"Validated {len(required)} evaluation artifacts and {len(summary)} summary rows.")
          PY

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-report
          path: reports/
          if-no-files-found: error
          retention-days: 30
