name: Synthetic evaluation report

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/login_logs.csv"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/synthetic-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Build API Docker image
        run: docker build --tag ai-login-anomaly-detector:ci .

      - name: Generate consolidated synthetic evaluation
        run: python -m src.evaluation_suite

      - name: Validate evaluation report outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          required = ["evaluation_summary.csv", "evaluation_report.md", "multi_seed_summary.csv", "temporal_window_metrics.csv"]
          missing = [name for name in required if not (Path("reports") / name).is_file()]
          if missing:
              raise SystemExit(f"Missing evaluation outputs: {missing}")
          summary = pd.read_csv(Path("reports") / "evaluation_summary.csv")
          if not summary.columns.is_unique:
              raise SystemExit("evaluation_summary.csv contains duplicate headers")
          expected = {"evaluation_scope", "detector", "metric", "mean", "std", "tp", "fp", "fn", "tn"}
          if set(summary.columns) != expected:
              raise SystemExit(f"Unexpected evaluation summary schema: {summary.columns.tolist()}")
          print(f"Validated {len(required)} evaluation artifacts and {len(summary)} summary rows.")
          PY

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-report
          path: reports/
          if-no-files-found: error
          retention-days: 30
